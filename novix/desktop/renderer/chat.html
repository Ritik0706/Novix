<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- chat card -->
		<div class="card" id="card">
			<!-- Sidebar -->
			<div class="sidebar" id="sidebar">
				<div class="sidebar-logo">
					<span class="logo-dot"></span>
					<h3>Synola</h3>
				</div>
				<div class="sidebar-header">
					<button id="new-chat">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none">
							<path
								d="M12 5V19M5 12H19"
								stroke="white"
								stroke-width="2"
								stroke-linecap="round"
							/>
						</svg>
						<span>New Chat</span>
					</button>
				</div>
				<section class="recommendation" aria-labelledby="recommendation-title">
					<div class="recommendation-heading">
						<span class="recommendation-kicker">SETUP</span>
						<h4 id="recommendation-title">Model recommendation</h4>
					</div>
					<p id="recommendation-model">Checking this device...</p>
					<p id="recommendation-reason" class="recommendation-reason"></p>
					<button id="install-recommendation" type="button" disabled>Install recommended model</button>
					<p id="recommendation-status" class="recommendation-status" role="status"></p>
				</section>
				<section class="model-management" aria-labelledby="model-management-title">
					<div class="recommendation-heading">
						<span class="recommendation-kicker">MODELS</span>
						<h4 id="model-management-title">Installed models</h4>
					</div>
					<p id="model-storage" class="model-storage" role="status">Loading storage...</p>
					<div id="model-list" class="model-list">
						<p class="recommendation-status">Loading models...</p>
					</div>
				</section>
				<div id="conversation-list"></div>
			</div>

			<!-- Chat Content -->
			<div class="chat-area">
				<div class="header">
					<button class="menu-btn" id="menuBtn">
						<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
							<rect x="3" y="4" width="6" height="16" rx="1.5" fill="white" />
							<rect
								x="11"
								y="4"
								width="10"
								height="16"
								rx="1.5"
								stroke="white"
								stroke-width="2"
							/>
						</svg>
					</button>
					<div class="text-center">Synola</div>
					<button id="closeBtn" class="close-btn" title="Close">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none">
							<path
								d="M18 6L6 18M6 6L18 18"
								stroke="white"
								stroke-width="2"
								stroke-linecap="round"
							/>
						</svg>
					</button>
				</div>

				<div id="messages" class="messages">
					<div class="bot bubble">Hello! I am Synola, How can I help you?</div>
				</div>

				<div class="input-area">
					<label for="image-input" class="image-btn" title="Attach an image">Attach</label>
					<input id="image-input" type="file" accept="image/*" hidden />
					<textarea id="msg" placeholder="Ask anything..."></textarea>
					<button id="send" type="button">➜</button>
				</div>
			</div>
		</div>

		<!-- =========================
     RENAME MODAL
========================= -->

		<div id="rename-modal" class="custom-modal">
			<div class="custom-modal-box">
				<div class="custom-modal-header">
					<h3>Rename conversation</h3>
					<button
						type="button"
						class="modal-close-btn"
						onclick="closeRenameModal()"
					>
						×
					</button>
				</div>

				<div class="custom-modal-body">
					<label for="rename-input"> Conversation name </label>

					<input
						type="text"
						id="rename-input"
						placeholder="Enter conversation name"
						autocomplete="off"
					/>
				</div>

				<div class="custom-modal-footer">
					<button
						type="button"
						id="rename-cancel-btn"
						class="modal-btn modal-cancel-btn"
					>
						Cancel
					</button>

					<button
						type="button"
						id="rename-confirm-btn"
						class="modal-btn modal-primary-btn"
					>
						Rename
					</button>
				</div>
			</div>
		</div>

		<!-- =========================
     DELETE MODAL
========================= -->

		<div id="delete-modal" class="custom-modal">
			<div class="custom-modal-box delete-modal-box">
				<div class="custom-modal-header">
					<h3>Delete conversation?</h3>

					<button
						type="button"
						class="modal-close-btn"
						onclick="closeDeleteModal()"
					>
						×
					</button>
				</div>

				<div class="custom-modal-body">
					<p>
						Are you sure you want to delete
						<strong id="delete-conversation-name"></strong>?
					</p>

					<p class="delete-warning">This action cannot be undone.</p>
				</div>

				<div class="custom-modal-footer">
					<button
						type="button"
						id="delete-cancel-btn"
						class="modal-btn modal-cancel-btn"
					>
						Cancel
					</button>

					<button
						type="button"
						id="delete-confirm-btn"
						class="modal-btn modal-delete-btn"
					>
						Delete
					</button>
				</div>
			</div>
		</div>

		<script src="chat.js"></script>
	</body>
</html>
