<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novix - Backend</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #111217;
      color: #e6e6eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      text-align: center;
      padding: 40px 48px;
      background: #1b1c22;
      border: 1px solid #2c2d36;
      border-radius: 16px;
    }
    .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #34d399; margin-bottom: 16px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #9a9ba6; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>Novix backend is running</h1>
    <p>Use the Novix desktop application to chat.</p>
  </div>
</body>
</html>
